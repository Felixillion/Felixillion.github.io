<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        UnumLocalia Viewer
    </title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <!-- Zipped file (.ulviewer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

</head>

<body>

<div id="app">

    <!-- Active toolbar (top) -->
    <div id="topbar">

        <div class="toolbar-group">
            <button id="loadDemoBtn">
                Demo
            </button>

            <input
                type="file"
                id="ulviewerFile"
                accept=".ulviewer,.zip"
            >
        </div>

        <div class="toolbar-divider"></div>

        <!-- H&E options -->
        <div class="toolbar-section">
            <div class="section-title">
                H&E
            </div>
            <div class="toolbar-group">
                <label>Opacity</label>
                <input
                    id="heOpacity"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value="1"
                >

            </div>

        </div>

        <div class="toolbar-divider"></div>
        

        <!-- Export panel -->
        <div class="toolbar-section">
            <div class="section-title">Screenshot</div>

            <div id="exportPanel">
                <label>
                    <input
                        type="checkbox"
                        id="exportHE"
                        checked
                    >
                    H&E
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="exportGenes"
                        checked
                    >
                    Genes
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="exportProteins"
                        checked
                    >
                    Proteins
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="exportSegs"
                        checked
                    >
                    Segmentations
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="exportScaleBar"
                        checked
                    >
                    Scale Bar
                </label>

            </div>

            <div class="toolbar-group">
                <button id="saveScreenshotBtn">
                    Export
                </button>
            </div>
        </div>

        <div class="toolbar-divider"></div>

        
        <!-- Segmentations -->
        <div class="toolbar-section">
            <div class="section-title">Segmentation</div>

            <div class="toolbar-group">
                <div class="toolbar-group">
                    <button id="loadSegBtn">
                        Load Cells
                    </button>
                </div>
                
                <label>Outline</label>
                <input
                    type="color"
                    id="segmentationColor"
                    value="#00ffff"
                >

                <label>Width</label>
                <input
                    type="range"
                    id="segmentationThickness"
                    min="0.5"
                    max="10"
                    step="0.5"
                    value="0.5"
                >

                <label>Opacity</label>
                <input
                    type="range"
                    id="segmentationOpacity"
                    min="0"
                    max="1"
                    step="0.05"
                    value="0.5"
                >

                <label>
                    <input
                        type="checkbox"
                        id="enableCellSelection"
                    >
                    Cell Selection
                </label>

            </div>

        </div>
    
    </div>

    <!-- Active proteins/genes -->
    <div id="layerBar">

        <div class="layer-group">

            <strong>Proteins:</strong>

            <div id="activeProteins"></div>

        </div>

        <div class="toolbar-divider"></div>

        <div class="layer-group">

            <strong>Genes:</strong>

            <div id="activeGenes"></div>

        </div>

    </div>

    <!-- Main area -->
    <div id="mainLayout">

        <!-- Protein panel (left) -->
        <div id="proteinPanel">

            <h3>Proteins</h3>

            <input
                id="proteinSearch"
                type="text"
                placeholder="Search proteins..."
            >

            <div
                id="proteinList"
                class="search-list"
            ></div>

            <h4>
                Loaded Proteins
                <button id="clearProteinsBtn">
                    Clear
                </button>
            </h4>

            <div id="loadedProteins"></div>

        </div>

        <!-- Central viewer -->
        <div id="viewerWrapper">

            <div id="viewer"></div>

            <!-- Cell information -->
            <div id="cellInfoPanel">
                No cell selected
            </div>

        </div>

        <!-- Gene panel (right) -->
        <div id="genePanel">

            <h3>Genes</h3>

            <input
                id="geneSearch"
                type="text"
                placeholder="Search genes..."
            >

            <div
                id="geneList"
                class="search-list"
            ></div>

            <h4>
                Loaded Genes
                <button id="clearGenesBtn">
                    Clear
                </button>
            </h4>

            <div id="loadedGenes"></div>

        </div>

    </div>

</div>


<!-- TEMPORARY -->

<div id="hiddenControls">

    <div id="dropZone"></div>

    <div id="info"></div>


</div>


<div id="legacyControls" style="display:none;">

    <input
        id="urlInput"
        type="text"
    >

    <button id="loadUrlBtn">
        Load URL
    </button>

</div>

<!-- END TEMPORARY -->

<script src="./main.js"></script>

</body>

</html>
