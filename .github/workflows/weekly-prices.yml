name: Weekly Price Update

# Weekly prices for every ticker in data/universe.json (ETF Tools page), then the asset-class
# years in data/etf_data.json. Saturday 06:17 UTC (Saturday afternoon in Sydney, after Friday's close).
on:
  schedule:
    - cron: '17 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-prices
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download weekly prices (Yahoo Finance)
        run: python .github/workflows/scripts/fetch_prices.py
      - name: Update asset-class returns from the new prices
        run: python .github/workflows/scripts/update_etf_data.py
      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git pull --rebase origin main 2>/dev/null || true
          git add data/prices data/etf_data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: weekly prices $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
