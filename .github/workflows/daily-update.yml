name: Daily Data Update

on:
  schedule:
    # ── Astrology, billionaires, promos: run daily ────────────────────────────────
    # 7am AEST  (UTC+10) = 9pm UTC previous day
    - cron: '0 21 * * *'
    # 7am AEDT  (UTC+11, daylight saving Oct–Apr) = 8pm UTC previous day
    - cron: '0 20 * * *'
    # ── Weekly jobs ───────────────────────────────────────────────
    # NB: cron day-of-week is evaluated in UTC. '30 21 * * 0' = Sunday 21:30 UTC
    # = Monday 07:30 AEST / 08:30 AEDT (Sydney). Distinct minute so it never collides with the daily run in the concurrency queue.
    - cron: '30 21 * * 0'
  workflow_dispatch: # manual trigger from GitHub Actions UI

concurrency:
  group: daily-update
  cancel-in-progress: false   # never cancel a run already in progress

# Opt into Node.js 24 for all actions in this workflow (avoids Node 20 deprecation warnings).
# Remove once actions/checkout, actions/setup-node etc. ship Node-24-native versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # (ETF prices moved to weekly-prices.yml — weekly, for ~670 tickers)

  # ── Job 2: Astrology data (Node.js) ─────────────────────────────────────
  update-astrology:
    name: Generate Astrology Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Re-fetch after Job 1's push so we don't overwrite its commit
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # NOTE: cache: npm is intentionally omitted here.
          # npm caching requires a committed package-lock.json in the repo.
          # Without one, setup-node throws "Some specified paths were not resolved".
          # Once you commit a package-lock.json, add back:
          #   cache: npm
          #   cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts
            else
              npm install --ignore-scripts
            fi
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Generate Astrology Data
        run: |
          SCRIPT=".github/workflows/scripts/generate_astrology_data.js"
          if [ -f "$SCRIPT" ]; then
            node "$SCRIPT"
          else
            echo "Script not found at $SCRIPT — skipping"
          fi
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git add data/ _data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update astrology data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Billionaire / wealth data ────────────────────────────────────
  update-billionaire-data:
    name: Update Billionaire & Wealth Data
    runs-on: ubuntu-latest
    needs: update-astrology
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update billionaire data
        run: |
          SCRIPT=".github/workflows/scripts/update_billionaire_data.py"
          if [ -f "$SCRIPT" ]; then
            python "$SCRIPT"
          else
            echo "Script not found at $SCRIPT — skipping"
          fi
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git add _data/billionaires.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update billionaire data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job: Promo/news watcher + Qantas route network (free RSS + public pages) ──
  update-promos:
    name: Watch FF / Status Credit promotions
    runs-on: ubuntu-latest
    needs: update-billionaire-data
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Watch RSS feeds for card offers and double Status Credits
        run: python .github/workflows/scripts/promo_watch.py
        continue-on-error: true
      - name: Refresh Qantas route network (weekly run only)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 21 * * 0'
        run: python .github/workflows/scripts/update_qf_network.py
        continue-on-error: true
      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git add _data/promos.json _data/qf_network.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update promo news / route network $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 4: Frequent Flyer data (Node.js, Mondays only) ──────────────────
  update-frequent-flyer:
    name: Scrape Frequent Flyer Data
    runs-on: ubuntu-latest
    needs: update-promos
    # Skip this job unless it is:
    #   a) a manual workflow_dispatch trigger, OR
    #   b) the weekly cron ('30 21 * * 0' = Monday morning Sydney)
    # The daily crons ('0 21 * * *' and '0 20 * * *') match everything including
    # Monday, which would run this job every day — so we match the exact schedule
    # string to restrict to Mondays only.
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && github.event.schedule == '30 21 * * 0')
      )
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts
            else
              npm install --ignore-scripts
            fi
          else
            echo "No package.json — skipping npm install"
          fi

      - name: Run Frequent Flyer scraper
        run: |
          SCRIPT=".github/workflows/scripts/ff_scraper.js"
          if [ -f "$SCRIPT" ]; then
            node "$SCRIPT"
          else
            echo "Script not found at $SCRIPT — skipping"
          fi
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          git add data/ _data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update FF data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
